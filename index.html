<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CCTV Forensic Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>🔐 CCTV Forensic Analyzer</h1>
        <p>Multi-Vendor DVR/NVR Forensic Analysis Tool</p>
    </div>

    <div class="container">
<div class="card">

    <h2>📁 Case Information</h2>

    <label>Case ID</label>

    <input type="text"
           id="caseId"
           placeholder="Example: CASE-2026-001"
           style="width:100%;
                  padding:12px;
                  margin-top:8px;
                  margin-bottom:12px;
                  border:1px solid #ccc;
                  border-radius:8px;">

    <label>Case Name</label>

    <input type="text"
           id="caseName"
           placeholder="Example: CCTV Investigation"
           style="width:100%;
                  padding:12px;
                  margin-top:8px;
                  margin-bottom:12px;
                  border:1px solid #ccc;
                  border-radius:8px;">

    <label>Investigator</label>

    <input type="text"
           id="investigator"
           placeholder="Investigator name"
           style="width:100%;
                  padding:12px;
                  margin-top:8px;
                  margin-bottom:12px;
                  border:1px solid #ccc;
                  border-radius:8px;">

    <label>Evidence ID</label>

    <input type="text"
           id="evidenceId"
           placeholder="Example: EV-001"
           style="width:100%;
                  padding:12px;
                  margin-top:8px;
                  margin-bottom:12px;
                  border:1px solid #ccc;
                  border-radius:8px;">

    <label>Source / Vendor</label>

    <input type="text"
           id="vendor"
           placeholder="Example: Hikvision / Dahua / Unknown"
           style="width:100%;
                  padding:12px;
                  margin-top:8px;
                  border:1px solid #ccc;
                  border-radius:8px;">

</div>
        <div class="card">

            <h2>📂 Evidence</h2>

            <p>
                Import CCTV evidence for forensic analysis.
            </p>

            <input type="file" id="evidenceFile">

            <p id="fileInfo">
                No evidence selected.
            </p>

            <video id="videoPlayer"
                   controls
                   playsinline
                   preload="metadata"
                   style="display:none;
                          width:100%;
                          height:240px;
                          margin-top:15px;
                          border-radius:12px;
                          background:#000;
                          object-fit:contain;">
            </video>

            <div id="hashSection"
                 style="display:none; margin-top:20px;">

                <h3>🔐 Evidence Integrity</h3>

                <p><strong>SHA-256:</strong></p>

                <div id="hashValue"
                     style="background:#f1f1f1;
                            padding:12px;
                            border-radius:8px;
                            word-break:break-all;
                            font-size:13px;">
                    Calculating...
                </div>

            </div>
            <div id="analysisSection"
     style="display:none; margin-top:20px;">

    <h3>🎥 Video Analysis</h3>

    <p>
        <strong>Duration:</strong>
        <span id="videoDuration">--</span>
    </p>

    <p>
        <strong>Current Time:</strong>
        <span id="currentTime">00:00</span>
    </p>

    <label>Go to time (seconds)</label>

    <input
        type="number"
        id="seekTime"
        min="0"
        step="1"
        placeholder="Example: 30"
        style="width:100%; padding:12px; margin-top:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px;"
    >

    <button
        id="seekButton"
        style="padding:12px 18px; border:0; border-radius:8px; cursor:pointer;"
    >
        Go to Time
    </button>

    <button
        id="captureFrameButton"
        style="padding:12px 18px; margin-left:8px; border:0; border-radius:8px; cursor:pointer;"
    >
        📸 Capture Frame
    </button>

    <canvas
        id="frameCanvas"
        style="display:none; width:100%; margin-top:15px; border-radius:8px;">
    </canvas>

    <div id="frameResult"
         style="margin-top:15px;">
    </div>

</div>

        </div>

    </div>


    <script>
        const caseId =
    document.getElementById("caseId");

const caseName =
    document.getElementById("caseName");

const investigator =
    document.getElementById("investigator");

const evidenceId =
    document.getElementById("evidenceId");

const vendor =
    document.getElementById("vendor");
        
function saveCaseInformation() {

    const caseData = {
        caseId: caseId.value,
        caseName: caseName.value,
        investigator: investigator.value,
        evidenceId: evidenceId.value,
        vendor: vendor.value
    };

    localStorage.setItem(
        "cctvCaseData",
        JSON.stringify(caseData)
    );
}
        [
    caseId,
    caseName,
    investigator,
    evidenceId,
    vendor
].forEach(input => {

    input.addEventListener(
        "input",
        saveCaseInformation
    );

});
        const savedCase =
    localStorage.getItem("cctvCaseData");

if (savedCase) {

    const caseData =
        JSON.parse(savedCase);

    caseId.value =
        caseData.caseId || "";

    caseName.value =
        caseData.caseName || "";

    investigator.value =
        caseData.investigator || "";

    evidenceId.value =
        caseData.evidenceId || "";

    vendor.value =
        caseData.vendor || "";
}
        const evidenceFile =
            document.getElementById("evidenceFile");

        const fileInfo =
            document.getElementById("fileInfo");

        const videoPlayer =
            document.getElementById("videoPlayer");

        const hashSection =
            document.getElementById("hashSection");

        const hashValue =
            document.getElementById("hashValue");


        async function calculateSHA256(file) {

            const buffer = await file.arrayBuffer();

            const hashBuffer =
                await crypto.subtle.digest(
                    "SHA-256",
                    buffer
                );

            const hashArray =
                Array.from(
                    new Uint8Array(hashBuffer)
                );

            return hashArray
                .map(byte =>
                    byte.toString(16).padStart(2, "0")
                )
                .join("");
        }


        evidenceFile.addEventListener(
            "change",
            async function () {

                const file = this.files[0];


                if (!file) {

                    fileInfo.textContent =
                        "No evidence selected.";

                    videoPlayer.style.display =
                        "none";

                    videoPlayer.removeAttribute(
                        "src"
                    );

                    hashSection.style.display =
                        "none";

                    return;
                }


                const sizeMB =
                    (file.size /
                    (1024 * 1024))
                    .toFixed(2);


                fileInfo.innerHTML =
                    "<strong>Evidence Selected</strong><br><br>" +
                    "📄 Name: " + file.name + "<br>" +
                    "📦 Size: " + sizeMB + " MB<br>" +
                    "🎞️ Type: " +
                    (file.type || "Unknown");


                /* VIDEO PLAYER */

                if (file.type.startsWith("video/")) {

                    const videoURL =
                        URL.createObjectURL(file);

                    videoPlayer.style.display =
                        "block";

                    videoPlayer.src =
                        videoURL;

                    videoPlayer.load();
                }


                /* SHA-256 HASH */

                hashSection.style.display =
                    "block";

                hashValue.textContent =
                    "Calculating SHA-256...";


                try {

                    const hash =
                        await calculateSHA256(file);

                    hashValue.textContent =
                        hash;

                } catch (error) {

                    hashValue.textContent =
                        "Hash calculation failed.";

                    console.error(error);
                }

            }
            );
            /* VIDEO ANALYSIS */

const analysisSection =
    document.getElementById("analysisSection");

const videoDuration =
    document.getElementById("videoDuration");

const currentTime =
    document.getElementById("currentTime");

const seekTime =
    document.getElementById("seekTime");

const seekButton =
    document.getElementById("seekButton");

const captureFrameButton =
    document.getElementById("captureFrameButton");

const frameCanvas =
    document.getElementById("frameCanvas");

const frameResult =
    document.getElementById("frameResult");


videoPlayer.addEventListener("loadedmetadata", function () {

    analysisSection.style.display = "block";

    videoDuration.textContent =
        formatTime(videoPlayer.duration);

});


videoPlayer.addEventListener("timeupdate", function () {

    currentTime.textContent =
        formatTime(videoPlayer.currentTime);

});


seekButton.addEventListener("click", function () {

    const time = Number(seekTime.value);

    if (
        isNaN(time) ||
        time < 0 ||
        time > videoPlayer.duration
    ) {
        alert("Enter a valid time.");
        return;
    }

    videoPlayer.currentTime = time;

    videoPlayer.play();

});


captureFrameButton.addEventListener("click", function () {

    if (!videoPlayer.videoWidth) {
        alert("Please load a video first.");
        return;
    }

    frameCanvas.width =
        videoPlayer.videoWidth;

    frameCanvas.height =
        videoPlayer.videoHeight;

    const context =
        frameCanvas.getContext("2d");

    context.drawImage(
        videoPlayer,
        0,
        0,
        frameCanvas.width,
        frameCanvas.height
    );

    frameCanvas.style.display = "block";

    frameResult.innerHTML =
        "<strong>📸 Frame Captured</strong><br>" +
        "Time: " +
        formatTime(videoPlayer.currentTime);

});


function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return String(minutes).padStart(2, "0")
        + ":" +
        String(secs).padStart(2, "0");
}

    </script>

</body>
</html>
