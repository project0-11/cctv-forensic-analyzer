<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CCTV Forensic Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>🔐 CCTV Forensic Analyzer</h1>
        <p>Multi-Vendor DVR/NVR Forensic Analysis Tool</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>📂 Evidence</h2>

            <p>
                Import CCTV evidence for forensic analysis.
            </p>

            <input type="file" id="evidenceFile">

            <p id="fileInfo">
                No evidence selected.
            </p>

            <video id="videoPlayer"
                   controls
                   playsinline
                   preload="metadata"
                   style="display:none;
                          width:100%;
                          height:240px;
                          margin-top:15px;
                          border-radius:12px;
                          background:#000;
                          object-fit:contain;">
            </video>

            <div id="hashSection"
                 style="display:none; margin-top:20px;">

                <h3>🔐 Evidence Integrity</h3>

                <p><strong>SHA-256:</strong></p>

                <div id="hashValue"
                     style="background:#f1f1f1;
                            padding:12px;
                            border-radius:8px;
                            word-break:break-all;
                            font-size:13px;">
                    Calculating...
                </div>

            </div>

        </div>

    </div>


    <script>

        const evidenceFile =
            document.getElementById("evidenceFile");

        const fileInfo =
            document.getElementById("fileInfo");

        const videoPlayer =
            document.getElementById("videoPlayer");

        const hashSection =
            document.getElementById("hashSection");

        const hashValue =
            document.getElementById("hashValue");


        async function calculateSHA256(file) {

            const buffer = await file.arrayBuffer();

            const hashBuffer =
                await crypto.subtle.digest(
                    "SHA-256",
                    buffer
                );

            const hashArray =
                Array.from(
                    new Uint8Array(hashBuffer)
                );

            return hashArray
                .map(byte =>
                    byte.toString(16).padStart(2, "0")
                )
                .join("");
        }


        evidenceFile.addEventListener(
            "change",
            async function () {

                const file = this.files[0];


                if (!file) {

                    fileInfo.textContent =
                        "No evidence selected.";

                    videoPlayer.style.display =
                        "none";

                    videoPlayer.removeAttribute(
                        "src"
                    );

                    hashSection.style.display =
                        "none";

                    return;
                }


                const sizeMB =
                    (file.size /
                    (1024 * 1024))
                    .toFixed(2);


                fileInfo.innerHTML =
                    "<strong>Evidence Selected</strong><br><br>" +
                    "📄 Name: " + file.name + "<br>" +
                    "📦 Size: " + sizeMB + " MB<br>" +
                    "🎞️ Type: " +
                    (file.type || "Unknown");


                /* VIDEO PLAYER */

                if (file.type.startsWith("video/")) {

                    const videoURL =
                        URL.createObjectURL(file);

                    videoPlayer.style.display =
                        "block";

                    videoPlayer.src =
                        videoURL;

                    videoPlayer.load();
                }


                /* SHA-256 HASH */

                hashSection.style.display =
                    "block";

                hashValue.textContent =
                    "Calculating SHA-256...";


                try {

                    const hash =
                        await calculateSHA256(file);

                    hashValue.textContent =
                        hash;

                } catch (error) {

                    hashValue.textContent =
                        "Hash calculation failed.";

                    console.error(error);
                }

            }
        );

    </script>

</body>
</html>
