<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CCTV Forensic Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>🔐 CCTV Forensic Analyzer</h1>
        <p>Multi-Vendor DVR/NVR Forensic Analysis Tool</p>
    </div>

    <div class="container">

        <div class="card">
            <h2>📂 Evidence</h2>

            <p>
                Import CCTV evidence for forensic analysis.
            </p>

            <input type="file" id="evidenceFile">

            <p id="fileInfo">
                No evidence selected.
            </p>
        </div>

    </div>
<script>
const evidenceFile = document.getElementById("evidenceFile");
const fileInfo = document.getElementById("fileInfo");

evidenceFile.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        fileInfo.textContent = "No evidence selected.";
        return;
    }

    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);

    fileInfo.innerHTML =
        "<strong>Evidence Selected</strong><br><br>" +
        "📄 Name: " + file.name + "<br>" +
        "📦 Size: " + sizeMB + " MB<br>" +
        "🎞️ Type: " + (file.type || "Unknown");

});
</script>
</body>
</html>
